<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sala de estudo do AprendeJunto.">
    <title>AprendeJunto | Sala de estudo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell session-page">
        <section class="card session-card" aria-labelledby="session-title">
            <div class="section-heading">
                <div>
                    <h1 id="session-title">Sala de estudo</h1>
                    <p class="session-meta">Sessão de 15 minutos</p>
                </div>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema" title="Alternar tema">◐</button>
            </div>

            <div class="video-placeholder" role="img" aria-label="Placeholder do vídeo WebRTC">
                <span>
                    <strong>Vídeo WebRTC</strong>
                    <small>A sala de vídeo aparecerá aqui</small>
                </span>
            </div>

            <p id="session-timer" class="timer" aria-label="Tempo restante">15:00</p>
            <button id="end-session-button" class="danger-button" type="button">Encerrar sessão</button>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
